<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สั่งอาหาร - โต๊ะ <span id="display-table"></span></title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen pb-36">

    <!-- Header -->
    <header class="bg-orange-500 text-white shadow-md sticky top-0 z-10">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-semibold">🍽️ ร้านอร่อยเด็ด</h1>
            <div class="flex items-center gap-2">
                <button onclick="toggleHistoryModal(true)" class="bg-orange-600 hover:bg-orange-700 px-3 py-1.5 rounded-xl text-xs font-medium shadow-inner transition cursor-pointer">
                    📜 ประวัติออเดอร์
                </button>
                <div class="bg-orange-600 px-3 py-1.5 rounded-xl text-xs font-medium shadow-inner">
                    โต๊ะ: <span id="display-table" class="font-bold">--</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto p-4">
        
        <!-- Category Filter Tabs -->
        <div class="flex gap-2 overflow-x-auto pb-2 mb-4 scrollbar-none">
            <button onclick="filterCategory('all')" id="btn-cat-all" class="category-btn whitespace-nowrap px-4 py-2 rounded-xl text-sm font-medium bg-orange-500 text-white shadow-sm transition cursor-pointer">
                🔥 ทั้งหมด
            </button>
            <button onclick="filterCategory('food')" id="btn-cat-food" class="category-btn whitespace-nowrap px-4 py-2 rounded-xl text-sm font-medium bg-white text-gray-600 border border-gray-200 shadow-sm transition cursor-pointer">
                🍲 อาหาร
            </button>
            <button onclick="filterCategory('drink')" id="btn-cat-drink" class="category-btn whitespace-nowrap px-4 py-2 rounded-xl text-sm font-medium bg-white text-gray-600 border border-gray-200 shadow-sm transition cursor-pointer">
                🧋 น้ำ/เครื่องดื่ม
            </button>
            <button onclick="filterCategory('burger')" id="btn-cat-burger" class="category-btn whitespace-nowrap px-4 py-2 rounded-xl text-sm font-medium bg-white text-gray-600 border border-gray-200 shadow-sm transition cursor-pointer">
                🍔 เบอร์เกอร์
            </button>
        </div>

        <h2 class="text-lg font-bold mb-3 text-gray-700">📋 รายการเมนู</h2>
        
        <!-- Menu List Grid -->
        <div id="menu-list" class="grid grid-cols-1 gap-3">
            <div class="text-center py-6 text-gray-400">กำลังโหลดเมนู...</div>
        </div>
    </main>

    <!-- Floating Cart Bar -->
    <div id="cart-container" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-xl p-4 rounded-t-2xl max-w-md mx-auto z-20">
        <div class="flex justify-between items-center mb-2">
            <h3 class="font-bold text-gray-700 flex items-center gap-1">🛒 ตะกร้าสินค้า</h3>
            <span id="cart-count" class="bg-orange-100 text-orange-600 text-xs font-bold px-2.5 py-0.5 rounded-full">0 รายการ</span>
        </div>
        
        <div id="cart-items" class="max-h-32 overflow-y-auto text-sm text-gray-600 mb-3 divide-y divide-gray-100">
            <div class="py-1 text-gray-400 italic">ยังไม่มีสินค้าในตะกร้า</div>
        </div>

        <div class="flex justify-between items-center pt-2 border-t border-gray-100 mb-3">
            <span class="text-gray-600 font-medium">ยอดรวมทั้งสิ้น:</span>
            <span id="cart-total" class="text-lg font-bold text-orange-600">0 บาท</span>
        </div>

        <button id="checkout-btn" onclick="submitOrder()" disabled 
            class="w-full bg-orange-500 hover:bg-orange-600 disabled:bg-gray-300 text-white font-medium py-2.5 rounded-xl transition shadow-sm cursor-pointer disabled:cursor-not-allowed">
            ยืนยันการสั่งซื้อ
        </button>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
            <div class="bg-orange-500 text-white p-4 flex justify-between items-center">
                <h3 class="font-bold text-base">📜 ประวัติการสั่งซื้อ (โต๊ะ <span id="modal-table-num">--</span>)</h3>
                <button onclick="toggleHistoryModal(false)" class="text-white hover:bg-orange-600 p-1.5 rounded-lg text-sm transition cursor-pointer">✕ ปิด</button>
            </div>
            <div id="history-list" class="p-4 overflow-y-auto space-y-3 flex-1 divide-y divide-gray-100">
                <div class="text-center py-6 text-gray-400">กำลังโหลดประวัติ...</div>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
