<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการออเดอร์ (ครัว / หลังบ้าน)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-4">

    <header class="max-w-4xl mx-auto bg-white shadow-sm rounded-2xl p-4 mb-6 flex justify-between items-center">

        </div>
    </header>

    <main class="max-w-4xl mx-auto">
        <h2 class="text-lg font-bold mb-4 text-gray-700">📦 รายการออเดอร์ทั้งหมด</h2>
        
        <!-- รายการออเดอร์ที่จะแสดงผลแบบเรียลไทม์ -->
        <div id="admin-orders-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="text-center py-10 text-gray-400 bg-white rounded-2xl col-span-full shadow-sm">กำลังโหลดออเดอร์...</div>
        </div>
    </main>

    <script type="module" src="admin.js"></script>
