<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการออเดอร์ (ครัว / หลังบ้าน)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-4">

    <header class="max-w-4xl mx-auto bg-white shadow-sm rounded-2xl p-4 mb-6 flex justify-between items-center">
        <h1 class="text-xl font-bold text-orange-600">🍳 ระบบจัดการออเดอร์ (ห้องครัว)</h1>
        <div class="text-sm bg-orange-50 text-orange-600 font-medium px-3 py-1.5 rounded-xl border border-orange-200">
            สถานะ: เชื่อมต่อ Real-time 🟢
        </div>
    </header>

    <main class="max-w-4xl mx-auto">
        
        <!-- ฟอร์มเพิ่มออเดอร์โดยแอดมิน -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 mb-6">
            <h2 class="font-bold text-gray-700 mb-3 flex items-center gap-1">➕ เพิ่มออเดอร์ใหม่ (หน้าร้าน)</h2>
            <form id="add-order-form" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                <input type="text" id="admin-table" placeholder="เลขโต๊ะ (เช่น 1)" required 
                    class="border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-orange-500">
                <input type="text" id="admin-menu-name" placeholder="ชื่อเมนูอาหาร" required 
                    class="border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-orange-500">
                <input type="number" id="admin-price" placeholder="ราคา (บาท)" required 
                    class="border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-orange-500">
                <button type="submit" 
                    class="bg-orange-500 hover:bg-orange-600 text-white text-sm font-medium py-2 rounded-xl transition cursor-pointer shadow-sm">
                    บันทึกออเดอร์
                </button>
            </form>
        </div>

        <h2 class="text-lg font-bold mb-4 text-gray-700">📦 รายการออเดอร์ทั้งหมด</h2>
        
        <!-- รายการออเดอร์แบบ Real-time -->
        <div id="admin-orders-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="text-center py-10 text-gray-400 bg-white rounded-2xl col-span-full shadow-sm">กำลังโหลดออเดอร์...</div>
        </div>
    </main>

    <script type="module" src="admin.js"></script>
</body>
</html>
