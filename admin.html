<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการร้านอาหาร (หลังบ้าน)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-4 pb-20">

    <header class="max-w-4xl mx-auto bg-white shadow-sm rounded-2xl p-4 mb-6 flex justify-between items-center">
        <h1 class="text-xl font-bold text-orange-600">🍳 ระบบจัดการร้านอาหาร (หลังบ้าน)</h1>
        <div class="text-sm bg-orange-50 text-orange-600 font-medium px-3 py-1.5 rounded-xl border border-orange-200">
            สถานะ: เชื่อมต่อ Real-time 🟢
        </div>
    </header>

    <main class="max-w-4xl mx-auto space-y-6">
        
        <!-- ฟอร์มเพิ่มเมนูอาหารเข้าร้าน -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
            <h2 class="font-bold text-gray-700 mb-3 flex items-center gap-1">➕ เพิ่มเมนูอาหาร/เครื่องดื่มเข้าร้าน</h2>
            <form id="add-menu-form" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                <input type="text" id="menu-name" placeholder="ชื่อเมนู (เช่น ชาไทย)" required 
                    class="border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-orange-500">
                <input type="number" id="menu-price" placeholder="ราคา (บาท)" required 
                    class="border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-orange-500">
                <select id="menu-category" required class="border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-orange-500 bg-white">
                    <option value="" disabled selected>-- เลือกหมวดหมู่ --</option>
                    <option value="food">🍲 อาหาร</option>
                    <option value="drink">🧋 น้ำ / เครื่องดื่ม</option>
                    <option value="burger">🍔 เบอร์เกอร์</option>
                </select>
                <button type="submit" 
                    class="bg-orange-500 hover:bg-orange-600 text-white text-sm font-medium py-2 rounded-xl transition cursor-pointer shadow-sm">
                    เพิ่มเมนูนี้
                </button>
            </form>
        </div>

        <!-- รายการออเดอร์จากลูกค้า -->
        <div>
            <h2 class="text-lg font-bold mb-4 text-gray-700">📦 รายการออเดอร์ของลูกค้า</h2>
            <div id="admin-orders-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="text-center py-10 text-gray-400 bg-white rounded-2xl col-span-full shadow-sm">กำลังโหลดออเดอร์...</div>
            </div>
        </div>

    </main>

    <script type="module" src="admin.js"></script>
</body>
</html>
